services:
  web:
    image: node:22-alpine
    container_name: silver-bridge-fe-dev-web
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: development
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "6510:3000"
    volumes:
      - .:/app
      - silver-bridge-fe-dev-node-modules:/app/node_modules
    networks:
      - silver-bridge-fe-dev-net
    stdin_open: true
    tty: true

networks:
  silver-bridge-fe-dev-net:
    name: silver-bridge-fe-dev-net

volumes:
  silver-bridge-fe-dev-node-modules:
    name: silver-bridge-fe-dev-node-modules
