services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_DOMAIN: ${NEXT_PUBLIC_API_DOMAIN:-http://211.236.174.23:6511}
    image: silver-bridge-fe-web:prod
    container_name: silver-bridge-fe-prod-web
    env_file:
      - .env.prod
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - silver-bridge-fe-prod-net

networks:
  silver-bridge-fe-prod-net:
    name: silver-bridge-fe-prod-net
